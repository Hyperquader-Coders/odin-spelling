# Per-repo settings for scripts/api.sh and scripts/cheatsheet.sh (POSIX sh).
# Everything else in those two scripts is identical in every binding.
REPO=odin-spelling
PACKAGES="spelling"
COLLECTION=spelling
DOC_COLLECTIONS="-collection:spelling=. -collection:glib=../odin-glib -collection:cairo=../odin-cairo -collection:pango=../odin-pango -collection:graphene=../odin-graphene -collection:pixbuf=../odin-gdk-pixbuf -collection:gtk4=../odin-gtk4 -collection:gtksourceview=../odin-gtksourceview"
INTRO='The reference is the [README](../README.md); the short form is the
[cheat sheet](CHEATSHEET.md).'
ALIASES="spell=spelling"
