# What odin-spelling is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-spelling"
license = "LGPL-2.1-or-later"
kind = "binding"
summary = "Odin bindings for libspelling, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "libspelling",
  "linux",
  "odin",
  "runic",
]
collection = "spelling"

[siblings.AMBER_ROOT]
odin-glib = "https://github.com/Hyperquader-Coders/odin-glib"
odin-cairo = "https://github.com/Hyperquader-Coders/odin-cairo"
odin-pango = "https://github.com/Hyperquader-Coders/odin-pango"
odin-graphene = "https://github.com/Hyperquader-Coders/odin-graphene"
odin-gdk-pixbuf = "https://github.com/Hyperquader-Coders/odin-gdk-pixbuf"
odin-gtk4 = "https://github.com/Hyperquader-Coders/odin-gtk4"
odin-gtksourceview = "https://github.com/Hyperquader-Coders/odin-gtksourceview"

[build]
# The library the binding is generated from, and the suite's GTK the tests link.
packages = [
  "amber-gtk4-dev",
  "libspelling-1-dev",
]
lib = [
  "spelling",
]

[test]
packages = [
  "shellcheck",
  "shfmt",
]
